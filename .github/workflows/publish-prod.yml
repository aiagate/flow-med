name: publish-prod

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  verify-release:
    name: verify release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require an exact SemVer tag at the workflow commit
        run: .github/scripts/verify-release-ref.sh

  pypi-publish:
    name: publish release to PyPI
    needs: verify-release
    runs-on: ubuntu-latest
    environment:
      name: publish-prod
    permissions:
      id-token: write
    env:
      TRUSTED_PUBLISHING: always
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        # https://github.com/actions/setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        #
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          # Install a specific version of uv.
          version: "0.11.4"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff format check
        run: uv run --frozen ruff format --check .

      - name: Run ruff linting
        run: uv run --frozen ruff check .

      - name: Run type checking with pyright
        run: uv run --frozen pyright

      - name: Run tests
        run: uv run --frozen pytest --cov --cov-report=term-missing

      - name: Build package distributions
        run: uv build

      - name: Publish package distributions to PyPI
        # https://docs.pypi.org/trusted-publishers/using-a-publisher/
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist/
